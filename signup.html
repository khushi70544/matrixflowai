<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign Up — MatrixFlowAI</title>
<meta name="description" content="Create your MatrixFlowAI account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-redirect-if-signed-in="true">
<header><div class="wrap"><nav>
<a class="brand" href="index.html">〽 MatrixFlow<span>AI</span></a>
<a class="ghost" href="index.html">← Home</a>
</nav></div></header>

<main class="auth-page">
  <div class="auth-card">
    <div class="grad auth-kicker">GET STARTED</div>
    <h1>Create your account</h1>
    <p class="muted">Sign up with email and password to access your dashboard.</p>

    <div id="authMessage" class="auth-message" hidden></div>

    <form id="signupForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="6" required placeholder="At least 6 characters">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required placeholder="Repeat your password">
      </div>
      <button class="btn auth-submit" type="submit">Create Account →</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</main>

<script type="module" src="auth.js"></script>
</body>
</html>
